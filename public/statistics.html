<!DOCTYPE html>

    <meta charset="utf-8" />

    <header id="site-header" class="dy-header"></header>

        <section class="stats-summary">
          <h1 class="stats-title" id="statsTitle">통계</h1>
          <p class="stats-value"><strong id="statsValue">-</strong> <span id="statsUnit"></span></p>
          <p class="stats-sub" id="statsSub">불러오는 중...</p>

        <div class="stats-chart">

    <div class="loader">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <script src="/assets/js/chartjs.min.js"></script>
    <script src="/js/aos.js"></script>
